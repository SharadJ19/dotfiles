# Foot Terminal Configuration - Optimized Tokyo Night Theme & Modern Settings

[main]
# Modern typography with fallbacks
font=JetBrainsMono Nerd Font:size=11.5:style=Regular

# Copy selected text to clipboard automatically
selection-target=clipboard

# Modern terminal behaviors
pad=6x6 center
resize-by-cells=no
box-drawings-uses-font-glyphs=yes

[cursor]
style=block
blink=yes
blink-rate=500

[colors-dark]
alpha=0.92
background=1a1b26
foreground=c0caf5

# Cursor colors set within the color scheme
cursor=1a1b26 c0caf5

## Normal colors (Tokyo Night Palette)
regular0=15161e  # black
regular1=f7768e  # red
regular2=9ece6a  # green
regular3=e0af68  # yellow
regular4=7aa2f7  # blue
regular5=bb9af7  # magenta
regular6=7dcfff  # cyan
regular7=a9b1d6  # white

## Bright colors
bright0=414868   # bright black
bright1=f7768e   # bright red
bright2=9ece6a   # bright green
bright3=e0af68   # bright yellow
bright4=7aa2f7   # bright blue
bright5=bb9af7   # bright magenta
bright6=7dcfff   # bright cyan
bright7=c0caf5   # bright white

## Selection highlighting
selection-foreground=c0caf5
selection-background=283457

[key-bindings]
# Leave clipboard-copy default (Ctrl+Shift+C) so Ctrl+C stays free for SIGINT
clipboard-paste=Control+v Control+Shift+v
